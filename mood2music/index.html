<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>thismoodthatmusic</title>
<link href="fontawesome1/css/all.min.css" rel="stylesheet" />
<link href="css/moneyy.css" rel="stylesheet" />
<style>
header { background-color: rgb(255, 243, 224); max-width: 600px; margin: 18px auto 8px; padding: 14px 20px; border-radius: 20px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
header h1 { margin: 0; color: #3a5a3a; font-weight: 800; letter-spacing: 0.04em; }
.hero-quote, .prompt-question { text-align: center; color: #f5efe6; }
.genre-section { margin-top: 18px; margin-bottom: 38px; padding: 0 20px; }
.genre-label { text-align: center; color: #f5efe6; font-size: 0.95rem; letter-spacing: 0.18em; margin-bottom: 14px; opacity: 0.85; }
.genre-selector { display: flex; flex-wrap: wrap; gap: 10px 12px; justify-content: center; max-width: 920px; margin: 0 auto; position: relative; z-index: 5; }
.genre-btn { padding: 8px 18px; border-radius: 22px; border: 2px solid #c8a96e; background: transparent; color: #f5efe6; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.18s, color 0.18s, transform 0.12s; letter-spacing: 0.04em; white-space: nowrap; flex: 0 0 auto; }
.genre-btn:hover { transform: translateY(-1px); }
.genre-btn.active { background: #c8a96e; color: #3a5a3a; }
.mood-grid-wrapper { margin-top: 18px; clear: both; padding: 0 20px; }
.mood-grid-wrapper .bt-grid { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; max-width: 920px; margin: 0 auto; }
.mood-grid-wrapper .bt-grid > div { width: 100% !important; margin: 0 !important; }
.mood-grid-wrapper .bt-main { width: 100% !important; padding: 16px 8px; border: 2px solid #c8a96e; border-radius: 10px; background: transparent; color: #f5efe6; font-size: 1.05rem; font-weight: 600; cursor: pointer; letter-spacing: 0.04em; transition: background 0.18s, color 0.18s, transform 0.12s; }
.mood-grid-wrapper .bt-main:hover { background: #c8a96e; color: #3a5a3a; transform: translateY(-2px); }
.mood-grid-wrapper .bt-main span { color: inherit; font-weight: inherit; }
@media (max-width: 800px) { .mood-grid-wrapper .bt-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 420px) { .mood-grid-wrapper .bt-grid { grid-template-columns: 1fr; } }
.result-box { max-width: 720px; margin: 30px auto; padding: 22px 28px; border: 2px solid #c8a96e; border-radius: 14px; background: rgba(0,0,0,0.18); color: #f5efe6; display: none; }
.result-box.show { display: block; }
.result-title { font-size: 0.85rem; letter-spacing: 0.25em; opacity: 0.7; margin-bottom: 10px; text-transform: uppercase; }
.result-genre-tag { display: inline-block; padding: 3px 12px; border-radius: 14px; background: #c8a96e; color: #3a5a3a; font-size: 0.8rem; font-weight: 700; margin-bottom: 12px; }
.result-content { font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; }
.loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; z-index: 9999; color: #f5efe6; }
.loading-overlay.show { display: flex; }
.spinner { width: 48px; height: 48px; border: 4px solid rgba(245,239,230,0.25); border-top-color: #c8a96e; border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loadingText { letter-spacing: 0.1em; font-size: 1rem; }
</style>
</head>
<body>
<header><h1>thismoodthatmusic</h1></header>
<main>
<h2 class="hero-quote">"No cap, these tunes are about to hit different for you."</h2>
<h3 class="prompt-question">"What's the mood?"</h3>
<section class="genre-section">
<div class="genre-label">-- PICK A GENRE --</div>
<div class="genre-selector" id="genreSelector">
<button class="genre-btn active" data-genre="Jazz">Jazz</button>
<button class="genre-btn" data-genre="Hip-Hop">Hip-Hop</button>
<button class="genre-btn" data-genre="Rock">Rock</button>
<button class="genre-btn" data-genre="Pop">Pop</button>
<button class="genre-btn" data-genre="R&B">R&amp;B</button>
<button class="genre-btn" data-genre="Electronic">Electronic</button>
<button class="genre-btn" data-genre="Classical">Classical</button>
<button class="genre-btn" data-genre="K-Pop">K-Pop</button>
<button class="genre-btn" data-genre="Soul">Soul</button>
<button class="genre-btn" data-genre="Lo-fi">Lo-fi</button>
</div>
</section>
<div class="mood-grid-wrapper">
<div class="bt-grid">
<div><button class="bt-main" data-mood="Beamin'"><span>😁 Beamin'</span></button></div>
<div><button class="bt-main" data-mood="Reflectin'"><span>🤔 Reflectin'</span></button></div>
<div><button class="bt-main" data-mood="Gloomin'"><span>😢 Gloomin'</span></button></div>
<div><button class="bt-main" data-mood="Crackin'"><span>🤣 Crackin'</span></button></div>
<div><button class="bt-main" data-mood="Bluein'"><span>😶 Bluein'</span></button></div>
<div><button class="bt-main" data-mood="Dreamin'"><span>🤩 Dreamin'</span></button></div>
<div><button class="bt-main" data-mood="Vibin'"><span>😎 Vibin'</span></button></div>
<div><button class="bt-main" data-mood="Lovin'"><span>😍 Lovin'</span></button></div>
<div><button class="bt-main" data-mood="Freakin'"><span>🤨 Freakin'</span></button></div>
<div><button class="bt-main" data-mood="Hornin'"><span>🤤 Hornin'</span></button></div>
<div><button class="bt-main" data-mood="Snoozin'"><span>🥱 Snoozin'</span></button></div>
<div><button class="bt-main" data-mood="Ragin'"><span>🔥 Ragin'</span></button></div>
<div><button class="bt-main" data-mood="Spookin'"><span>😨 Spookin'</span></button></div>
<div><button class="bt-main" data-mood="Empty.."><span>😔 Empty..</span></button></div>
<div><button class="bt-main" data-mood="Stressin'"><span>😬 Stressin'</span></button></div>
<div><button class="bt-main" data-mood="Deepin'"><span>🤓 Deepin'</span></button></div>
<div><button class="bt-main" data-mood="Hyped'"><span>🤪 Hyped'</span></button></div>
<div><button class="bt-main" data-mood="Chillin'"><span>🧊 Chillin'</span></button></div>
<div><button class="bt-main" data-mood="Nostalgic"><span>🥹 Nostalgic</span></button></div>
<div><button class="bt-main" data-mood="Confident"><span>😌 Confident</span></button></div>
</div>
</div>
<div class="result-box" id="resultBox">
<div class="result-title">your track</div>
<div class="result-genre-tag" id="resultGenreTag"></div>
<div class="result-content" id="resultContent"></div>
</div>
</main>
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<span id="loadingText">finding your vibe...</span>
</div>
<script>
let selectedGenre = "Jazz";
const genreBtns = document.querySelectorAll(".genre-btn");
genreBtns.forEach(function(btn){ btn.addEventListener("click", function(){ genreBtns.forEach(function(b){ b.classList.remove("active"); }); btn.classList.add("active"); selectedGenre = btn.dataset.genre; }); });
const moodBtns = document.querySelectorAll(".bt-main");
const overlay = document.getElementById("loadingOverlay");
const loadingText = document.getElementById("loadingText");
const resultBox = document.getElementById("resultBox");
const resultContent = document.getElementById("resultContent");
const resultGenreTag = document.getElementById("resultGenreTag");
moodBtns.forEach(function(btn){ btn.addEventListener("click", async function(){ const mood = btn.dataset.mood; loadingText.textContent = "finding " + selectedGenre.toLowerCase() + " vibes for your " + mood.toLowerCase() + " mood..."; overlay.classList.add("show"); resultBox.classList.remove("show"); try { const res = await fetch("/api/recommend", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mood: mood, genre: selectedGenre }) }); const data = await res.json(); resultGenreTag.textContent = selectedGenre + " // " + mood; resultContent.textContent = data.recommendation || data.error || "no result"; resultBox.classList.add("show"); resultBox.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) { resultGenreTag.textContent = selectedGenre + " // " + mood; resultContent.textContent = "error: " + e.message; resultBox.classList.add("show"); } finally { overlay.classList.remove("show"); } }); });
</script>
</body>
</html>
